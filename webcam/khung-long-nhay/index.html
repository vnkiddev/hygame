<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khủng Long Nhảy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌵</text></svg>">
<link rel="stylesheet" href="../lib/core.css">
</head>
<body>
<script src="../lib/core.js"></script>
<script src="../lib/dino.js"></script>
<script>
// ================= KHỦNG LONG NHẢY =================
// Khủng long tự chạy. Bé BẬT NHẢY thật thì khủng long nhảy theo:
//   - hoa quả bay trên cao: nhảy lên ăn (+1)
//   - xương rồng dưới đất: nhảy qua để tránh (đụng thì −1, khủng long loạng choạng)
// Nhận nhảy bằng lõi chung (hông bật lên so với mốc đứng; ↑/↓ chỉnh độ nhạy).
// Cú nhảy bay lâu (~1 giây) để bé có thời gian, và có dấu "⬆ NHẢY!" báo trước.
// Hai bé: hai làn trên dưới, gặp cùng một chuỗi hoa quả/xương rồng cho công bằng.

const DINO = [
  { body: '#ff5a5f', dark: '#b83236', belly: '#ffd0d0', kind: 'rex' },
  { body: '#3d8bff', dark: '#1f5fbf', belly: '#d6e6ff', kind: 'long' },
];
const SOLO = { body: '#43a047', dark: '#2e7d32', belly: '#dcedc8', kind: 'rex' };
const FRUITS = ['🍎', '🍌', '🍓', '🍊', '🍇', '🍉', '🍑', '🍒', '🥝'];

const GAME = {
  title: 'Khủng Long Nhảy',
  desc: 'Khủng long tự chạy — con <b>bật nhảy</b> thật cao để nó nhảy theo! 🦖<br>🍎 Nhảy lên <b>ăn hoa quả</b> (+1) · 🌵 Nhảy qua <b>xương rồng</b> (đụng là −1). 60 giây, ai ăn nhiều nhất thắng!',
  keys: '↑/↓ = độ nhạy nhảy · Không có camera: Space = P1 nhảy · Enter = P2 nhảy · bấm vào làn = nhảy',
  tune: 'dino',
  camOff: true,
  DUR: 60, AIR: 1.25,          // thời gian một cú nhảy trên không (giây)
  menuInit() {
    cv.addEventListener('pointerdown', e => {
      if (G.state !== 'play') return;
      const i = clamp(Math.floor((e.clientY - this.trackTop()) / this.laneH()), 0, this.N - 1);
      this.jump(i);
    });
  },
  reset(N) {
    this.N = N; this.time = this.DUR; this.fast = false;
    this.dist = 0; this.events = []; this.nextEv = 1.2;
    this.p = [...Array(N)].map(() => ({ score: 0, eaten: 0, hits: 0, jy: 0, jt: -1, phase: 0, hurt: 0, flash: 0, done: new Set() }));
    BGM.setFast(false);
  },
  // ---------- bố cục ----------
  trackTop() { return useCamBG() ? H * .42 : H * .18; },
  laneH() { return (H - this.trackTop()) / this.N; },
  groundY(i) { return this.trackTop() + this.laneH() * (i + .9); },
  dinoX() { return W * .2; },
  size() { return this.laneH() * .42; },
  jumpH() { return this.laneH() * .45; },
  // quả treo cao hơn đầu khủng long đứng yên — phải nhảy mới với tới
  fruitY(i, e) { return this.groundY(i) - this.size() * .75 - this.jumpH() * .8 * (e.arc || 1); },
  speed() { return W * (.3 + .12 * (1 - this.time / this.DUR)); },   // px/giây, nhanh dần

  // ---------- nhảy ----------
  onJump(i) { this.jump(i); },
  onKey(c) {
    if (G.camReady) return;
    if (c === 'Space' || c === 'KeyA') this.jump(0);
    if ((c === 'Enter' || c === 'KeyL') && this.N > 1) this.jump(1);
  },
  jump(i) {
    const p = this.p[i]; if (!p || G.state !== 'play') return;
    if (p.jt >= 0 && p.jt < this.AIR * .7) return;      // đang bay thì không nhảy kép (gần chạm đất thì cho)
    p.jt = 0; SFX.jump();
  },

  // ---------- chuỗi vật cản / hoa quả (chung cho cả hai làn) ----------
  // Mỗi sự kiện có toạ độ x theo "quãng đường" (px) — làn nào cũng gặp y hệt.
  spawn() {
    const x = this.dist + W * 1.05, r = Math.random();
    if (r < .38) this.events.push({ x, kind: 'cactus', big: Math.random() < .3 });
    else if (r < .72) this.events.push({ x, kind: 'fruit', f: FRUITS[Math.random() * FRUITS.length | 0] });
    else if (r < .9) {      // xương rồng có quả ở trên: một cú nhảy vừa tránh vừa ăn
      this.events.push({ x, kind: 'cactus', big: false });
      this.events.push({ x, kind: 'fruit', f: FRUITS[Math.random() * FRUITS.length | 0] });
    } else {                // ba quả xếp vòng cung: nhảy đúng lúc ăn cả ba
      const f = FRUITS[Math.random() * FRUITS.length | 0], gap = this.size() * .9;
      for (const k of [-1, 0, 1]) this.events.push({ x: x + k * gap, kind: 'fruit', f, arc: k === 0 ? 1 : .8 });
    }
  },
  update(dt) {
    this.time -= dt;
    if (this.time <= 0) { this.time = 0; return this.finish(); }
    if (!this.fast && this.time <= 10) { this.fast = true; BGM.setFast(true); floatText(W / 2, H * .3, '⚡ Nhanh lên!', '#e53935', .08); }
    const v = this.speed();
    this.dist += v * dt;
    this.nextEv -= dt;
    if (this.nextEv <= 0) { this.spawn(); this.nextEv = rand(1.5, 2.3) - (1 - this.time / this.DUR) * .4; }
    this.events = this.events.filter(e => e.x - this.dist > -W * .2);
    const s = this.size(), H0 = this.jumpH(), T = this.AIR;
    for (let i = 0; i < this.N; i++) {
      const p = this.p[i];
      p.hurt = Math.max(0, p.hurt - dt); p.flash = Math.max(0, p.flash - dt);
      p.phase += dt * (v / W) * 9;
      if (p.jt >= 0) {
        p.jt += dt;
        // bật lên rất nhanh (bé nhảy muộn vẫn kịp qua), lơ lửng, rồi rơi từ từ
        const t = p.jt / T;
        const f = t < .12 ? 1 - Math.pow(1 - t / .12, 2) : t < .62 ? 1 : 1 - Math.pow((t - .62) / .38, 2);
        p.jy = t >= 1 ? 0 : H0 * f;
        if (t >= 1) { p.jt = -1; p.jy = 0; }
      }
      // va chạm: hộp của khủng long so với từng vật
      const dx0 = this.dinoX(), gy = this.groundY(i);
      const feet = gy - p.jy, headY = feet - s * .85;
      for (const e of this.events) {
        if (p.done.has(e)) continue;
        const ex = dx0 + (e.x - this.dist);
        if (e.kind === 'cactus') {
          // vùng va chạm hẹp hơn hình vẽ một chút — trẻ con, tha cho sượt qua
          const cw = s * (e.big ? .26 : .2), ch = s * (e.big ? .6 : .45);
          if (Math.abs(ex - dx0) < cw / 2 + s * .08 && feet > gy - ch) {
            p.done.add(e);
            if (p.hurt <= 0) {
              p.score = Math.max(0, p.score - 1); p.hits++; p.hurt = 1;
              SFX.bad(); floatText(dx0, gy - s * 1.2, 'Ối! 🌵 −1', '#2e7d32', .055);
              burst(dx0, feet - s * .4, 10, ['#81c784', '#ffffff', '#a5d6a7'], .6);
            }
          } else if (ex < dx0 - s * .5) p.done.add(e);
        } else {
          const fy = this.fruitY(i, e), fr = s * .28;
          if (Math.hypot(ex - (dx0 + s * .25), fy - (headY + s * .2)) < fr + s * .32) {
            p.done.add(e); p.score++; p.eaten++; p.flash = .2;
            SFX.eat(); burst(ex, fy, 12, ['#ffd54f', '#fff', '#ff8a80'], .7);
            floatText(ex, fy - s * .4, '+1', this.N > 1 ? DARKS[i] : '#e65100', .055);
          } else if (ex < dx0 - s * .6) p.done.add(e);
        }
      }
    }
  },
  finish() {
    if (this.N === 1) {
      const sc = this.p[0].score, best = store.get('kg_jump_best', 0);
      if (sc > best) store.set('kg_jump_best', sc);
      return endGame('🎉 Hết giờ!', [{ i: 0, text: `Được ${sc} điểm 🦖 (ăn ${this.p[0].eaten} quả)` }], sc > best ? '🏆 Kỷ lục mới!' : `Kỷ lục: ${best} điểm`);
    }
    endVersus(this.p.map(p => p.score), s => `${s} điểm`);
  },

  // ---------- vẽ ----------
  draw() {
    const N = this.N, top = this.trackTop(), lh = this.laneH(), s = this.size(), H0 = this.jumpH();
    if (useCamBG()) drawCamBG(.05);
    else {
      const g = ctx.createLinearGradient(0, 0, 0, top + lh); g.addColorStop(0, '#ffe0b2'); g.addColorStop(1, '#fff8e1');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffcc80';     // đồi cát xa
      const off = (this.dist * .2) % (W * .5);
      for (let k = -1; k < 4; k++) { const x = k * W * .5 - off; ctx.beginPath(); ctx.ellipse(x + W * .25, top + 4, W * .3, H * .08, 0, Math.PI, 0); ctx.fill(); }
      ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(W * .88, H * .1, H * .06, 0, 7); ctx.fill();
    }
    for (let i = 0; i < N; i++) {
      const y0 = top + lh * i, gy = this.groundY(i), p = this.p[i];
      // nền làn: trời trong + mặt đất cát
      ctx.fillStyle = useCamBG() ? 'rgba(255,248,225,.55)' : (i % 2 ? 'rgba(255,255,255,.25)' : 'rgba(255,255,255,.4)');
      ctx.fillRect(0, y0, W, gy - y0);
      ctx.fillStyle = '#e0b46a'; ctx.fillRect(0, gy, W, y0 + lh - gy);
      ctx.fillStyle = 'rgba(141,110,99,.45)';
      const sp = this.dist % (W * .06);
      for (let x = -sp; x < W; x += W * .06) ctx.fillRect(x, gy + (y0 + lh - gy) * .4, W * .02, 3);
      if (i) { ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(0, y0 - 2, W, 4); }
      if (N > 1) outlined(PNAME[i], W * .04, y0 + lh * .2, lh * .16, '#fff', DARKS[i]);
      // vật cản + hoa quả
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      let warn = false;
      for (const e of this.events) {
        const ex = this.dinoX() + (e.x - this.dist);
        if (ex < -s || ex > W + s) continue;
        if (e.kind === 'cactus') {
          const ch = s * (e.big ? .62 : .48);
          ctx.font = emojiFont(ch * 1.15); ctx.fillText('🌵', ex, gy + ch * .08);
          // báo trước: xương rồng sắp tới chân khủng long
          const tReach = (ex - this.dinoX()) / this.speed();
          if (tReach > 0 && tReach < 1.3 && !p.done.has(e)) warn = true;
        } else if (!p.done.has(e)) {
          const fy = this.fruitY(i, e);
          ctx.font = emojiFont(s * .55); ctx.textBaseline = 'middle';
          ctx.fillText(e.f, ex, fy + Math.sin(G.t * 4 + e.x) * s * .04);
          ctx.textBaseline = 'bottom';
        }
      }
      // khủng long
      const c = N === 1 ? SOLO : DINO[i], dx = this.dinoX(), feet = gy - p.jy;
      ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(dx, gy, s * .45 * (1 - p.jy / H0 * .5), s * .06, 0, 0, 7); ctx.fill();
      ctx.save();
      if (p.hurt > 0 && Math.sin(G.t * 30) > 0) ctx.globalAlpha = .45;      // nhấp nháy khi vừa đụng
      drawDino(dx, feet + s * .02, s, c, p.jt >= 0 ? .25 : p.phase, p.jt >= 0 ? 1 : 3, false, p.flash);
      ctx.restore();
      if (warn && p.jt < 0) outlined('⬆ NHẢY!', dx, feet - s * 1.25 - Math.abs(Math.sin(G.t * 8)) * s * .1, s * .32, '#ff5722', '#fff');
      if (G.camReady && G.state === 'play' && !TR[i].seen) outlined('Chưa thấy bé', W / 2, y0 + lh * .45, lh * .14, '#fff', '#000');
    }
    // điểm + giờ
    outlined(`⏱ ${Math.ceil(this.time)}`, W / 2, H * .055, H * .06, this.time <= 10 ? '#e53935' : '#5d4037');
    if (N === 1) outlined(`🦖 ${this.p[0].score}`, H * .03, H * .055, H * .07, '#2e7d32', '#fff', 'left');
    else for (let i = 0; i < N; i++) {
      const zx = i === 0 ? W * .15 : W * .85, fs = H * .05;
      roundRect(zx - fs * 2.2, H * .055 - fs * .7, fs * 4.4, fs * 1.4, fs * .7); ctx.fillStyle = COLORS[i]; ctx.fill();
      outlined(`${PNAME[i]}  ${this.p[i].score}`, zx, H * .055, fs * .85, '#fff', DARKS[i]);
    }
    if (G.camReady) outlined(`Độ nhạy nhảy ${sensLevel()} (↑/↓)`, W - H * .02, H * .12, H * .022, '#333', '#fff', 'right', 'middle', 700);
  },
  msgY() { return this.trackTop() - H * .03; }
};

boot(GAME);
</script>
</body>
</html>
