<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Vận động cùng máy xúc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤸</text></svg>">
<link rel="stylesheet" href="lib/style.css">
<style>
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(16px,4vh,40px);padding:20px;text-align:center}
  h1{font-size:clamp(34px,7vw,72px);margin:0;line-height:1.05}
  h1 small{display:block;font-size:.4em;font-weight:500;opacity:.6;margin-top:.4em}
  .hint{font-size:clamp(13px,2.2vw,17px);opacity:.6;max-width:42ch;line-height:1.5;margin:0}
  .back{background:rgba(43,42,40,.08);color:var(--asphalt)}
  .big.lava{background:var(--rust);border-bottom-color:var(--rust-dk);color:#fff}
</style>
</head>
<body>
<main>
  <h1>Vận động cùng máy xúc<small>Đứng trước camera rồi chọn trò nào!</small></h1>
  <div class="row">
    <a class="big" href="dap-chuot/">
      <span class="emoji">🔨</span><span>Đập chuột chũi</span><span class="sub">1 hoặc 2 người · dùng tay</span>
    </a>
    <a class="big lava" href="dung-nham/">
      <span class="emoji">🌋</span><span>Sàn là dung nham</span><span class="sub">cả nhà cùng chơi · chạy nhảy</span>
    </a>
  </div>
  <p class="hint">Đặt máy ở chỗ camera thấy được cả người bé (lùi xa 2–3 mét). Lần đầu trình duyệt sẽ hỏi quyền dùng camera — bấm <b>Cho phép</b>.</p>
  <a class="ghost back" href="../">🚜 Về Học cùng máy xúc</a>
</main>

</html>
